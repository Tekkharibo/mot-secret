name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Navigateurs Playwright préinstallés (même version que @playwright/test dans package.json).
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # Le site publié se prépare sans erreur (fichiers copiés, adresses versionnées).
      - run: tools/build-site.sh /tmp/site ci
      - run: npm run test:e2e
        env:
          HOME: /root
