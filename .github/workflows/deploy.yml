name: Déploiement

# Publie le site sur GitHub Pages à chaque mise à jour de main (version validée).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Seuls les fichiers servis au navigateur sont publiés (ni tests, ni outils, ni docs).
      - run: |
          mkdir _site
          cp -R index.html style.css LICENSE src fonts emoji vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
